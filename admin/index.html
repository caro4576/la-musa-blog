<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Admin — La Musa Incarnata</title>
    </head>

    <body>

        <header>
            <h1>La Musa Incarnata</h1>
            <p>Panel de administración</p>
        </header>

        <main>

            <!-- ================================================== -->
            <!-- OBRAS -->
            <!-- ================================================== -->

            <section id="admin-obras">

                <h2>Obras</h2>

                <!-- NUEVA OBRA -->

                <form id="form-obra">

                    <h3>Nueva obra</h3>

                    <input type="text" id="titulo" placeholder="Título de la obra" required>

                    <input type="text" id="categoria" placeholder="Categoría" required>

                    <textarea id="descripcion" placeholder="Descripción de la obra" rows="5"></textarea>

                    <button type="submit">
                        Guardar obra
                    </button>

                </form>


                <!-- EDITAR OBRA -->

                <form id="form-editar-obra" style="display: none;">

                    <h3>Editar obra</h3>

                    <input type="text" id="editar-titulo" placeholder="Título de la obra" required>

                    <input type="text" id="editar-categoria" placeholder="Categoría" required>

                    <textarea id="editar-descripcion" placeholder="Descripción de la obra" rows="5"></textarea>

                    <button type="submit">
                        Guardar cambios
                    </button>

                    <button type="button" id="cancelar-edicion">
                        Cancelar
                    </button>

                </form>

            </section>


            <!-- ================================================== -->
            <!-- OBRAS EXISTENTES -->
            <!-- ================================================== -->

            <section>

                <h2>Obras existentes</h2>

                <div id="lista-obras">
                    <!-- Las obras aparecerán acá desde MongoDB -->
                </div>

            </section>


            <!-- ================================================== -->
            <!-- ESCRITURAS -->
            <!-- ================================================== -->

            <section id="admin-escrituras">

                <h2>Escrituras</h2>

                <!-- NUEVA ESCRITURA -->

                <form id="form-escritura">

                    <h3>Nueva escritura</h3>

                    <input type="text" id="escritura-titulo" placeholder="Título de la escritura" required>

                    <input type="text" id="escritura-categoria" placeholder="Categoría" required>

                    <textarea id="escritura-contenido" placeholder="Contenido de la escritura" rows="10"
                        required></textarea>

                    <button type="submit">
                        Guardar escritura
                    </button>

                </form>
                <!-- EDITAR ESCRITURA -->
                
                <form id="form-editar-escritura" style="display: none;">
                
                    <h3>Editar escritura</h3>
                
                    <input type="text" id="editar-escritura-titulo" placeholder="Título de la escritura" required>
                
                    <input type="text" id="editar-escritura-categoria" placeholder="Categoría" required>
                
                    <textarea id="editar-escritura-contenido" placeholder="Contenido de la escritura" rows="10" required></textarea>
                
                    <button type="submit">
                        Guardar cambios
                    </button>
                
                    <button type="button" id="cancelar-edicion-escritura">
                        Cancelar
                    </button>
                
                </form>


                <!-- LISTA DE ESCRITURAS -->

                <div id="lista-escrituras"></div>

            </section>


            <!-- ================================================== -->
            <!-- LIBROS -->
            <!-- ================================================== -->

            <section id="admin-libros">

                <h2>Libros</h2>

                <!-- NUEVO LIBRO -->

                <form id="form-libro">

                    <h3>Nuevo libro</h3>

                    <input type="text" id="libro-titulo" placeholder="Título del libro" required>

                    <textarea id="libro-descripcion" placeholder="Descripción del libro" rows="6" required></textarea>

                    <input type="text" id="libro-fecha" placeholder="Fecha de lanzamiento">

                    <input type="url" id="libro-enlace" placeholder="Enlace de compra">

                    <button type="submit">
                        Guardar libro
                    </button>

                </form>


                <!-- EDITAR LIBRO -->

                <form id="form-editar-libro" style="display: none;">

                    <h3>Editar libro</h3>

                    <input type="text" id="editar-libro-titulo" placeholder="Título del libro" required>

                    <textarea id="editar-libro-descripcion" placeholder="Descripción del libro" rows="6"
                        required></textarea>

                    <input type="text" id="editar-libro-fecha" placeholder="Fecha de lanzamiento">

                    <input type="url" id="editar-libro-enlace" placeholder="Enlace de compra">

                    <button type="submit">
                        Guardar cambios
                    </button>

                    <button type="button" id="cancelar-edicion-libro">
                        Cancelar
                    </button>

                </form>


                <!-- LISTA DE LIBROS -->

                <div id="lista-libros"></div>

            </section>

        </main>


        <script src="admin.js"></script>

    </body>

</html>
